server:
  port: 5000

spring:
  application:
    name: yologram-api-v1
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# 검색 엔진 (셀프호스팅 OpenSearch) — prod는 접속 3개를 Parameter Store에서 주입.
# enabled=false면 클라이언트·검색 서비스·검색 API 빈을 만들지 않는다 (로컬이 prod 인덱스를 건드리지 못하게)
opensearch:
  main:
    enabled: false
    uri:
    username:
    password:

cache:
  data:
    redis:
      host:
      port: 6379

database:
  main:
    writer:
      datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        # 커넥션 수명 15분 — 낡은 커넥션 주기 교체 (번장 bun-ums-api 미러, Hikari 기본 30분 단축).
        # 죽은 커넥션 소켓 타임아웃은 JDBC URL의 socketTimeout/connectTimeout이 담당 (SSM url 파라미터)
        hikari:
          max-lifetime: 900000
    reader:
      datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          max-lifetime: 900000
    jpa:
      properties:
        hibernate.jdbc.batch_size: 50
        hibernate.order_inserts: true
        hibernate.order_updates: true
        hibernate.default_batch_fetch_size: 100
        hibernate.jdbc.time_zone: Asia/Seoul
        hibernate.cache.use_second_level_cache: false
        hibernate.cache.use_query_cache: false
        hibernate.hbm2ddl.auto: validate
      show-sql: false
      open-in-view: false

yologram:
  # 이벤트 발행(Kinesis) — worker의 구독 설정(yologram.events.subscribe.{이벤트})과 대칭.
  # 스트림 이름은 비밀값이 아니라 고정 이름이므로 Parameter Store가 아닌 yaml에 직접 둔다.
  # 기본은 비활성 = 발행 스킵 (로컬·테스트에서 prod 스트림이 오염되지 않도록). prod는 application-prod.yaml에서 활성화
  events:
    publish:
      post-view:
        enabled: false
        stream:
  # 메시지 발행(SQS) — events(스트림)와 수단으로 갈린 형제 축. worker의 messages.subscribe와 대칭.
  # 기본 비활성 — 로컬에서 prod 큐에 인덱싱 작업을 넣어 실인덱스를 건드리는 사고 방지
  messages:
    publish:
      post-index:
        enabled: false
        queue:
  ses:
    from-address: no-reply@yologram.link
  auth:
    jwt:
      secret:   # /yologram/service/yologram-api-v1_{ENV}/yologram.auth.jwt.secret
      expire: 86400
      issuer: yologram.link
      audience: yologram.client
    admin-jwt:
      secret:   # /yologram/service/yologram-api-v1_{ENV}/yologram.auth.admin-jwt.secret
      expire: 86400
      issuer: yologram.link
      audience: yologram.admin

springdoc:
  swagger-ui:
    path: /api/v1/docs
    tags-sorter: alpha
  api-docs:
    path: /api/v1/api-docs

logging:
  level:
    io.lettuce.core.AbstractRedisClient: DEBUG

management:
  health: # Redis 장애가 서비스 health DOWN으로 전파되지 않도록 Redis health indicator 비활성
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint:   # /yologram/service/yologram-api-v1_{ENV}/management.otlp.tracing.endpoint
      headers:
        Authorization:  # /yologram/service/yologram-api-v1_{ENV}/management.otlp.tracing.headers.Authorization
    metrics:
      export:
        url:    # /yologram/service/yologram-api-v1_{ENV}/management.otlp.metrics.export.url
        step: 1m
        headers:
          Authorization:  # /yologram/service/yologram-api-v1_{ENV}/management.otlp.metrics.export.headers.Authorization
    logging:
      endpoint:   # /yologram/service/yologram-api-v1_{ENV}/management.otlp.logging.endpoint
      headers:
        Authorization:  # /yologram/service/yologram-api-v1_{ENV}/management.otlp.logging.headers.Authorization
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment.name: ${spring.profiles.active:default}
      service.instance.id: ${server.hostname:unknown}
      service.namespace: yologram
  metrics:
    tags:
      service.name: ${spring.application.name}
      deployment.environment.name: ${spring.profiles.active:default}
      service.instance.id: ${server.hostname:unknown}
      service.namespace: yologram
