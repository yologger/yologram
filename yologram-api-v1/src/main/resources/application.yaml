server:
  port: 5000

spring:
  application:
    name: yologram-api-v1
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

cache:
  data:
    redis:
      host:
      port: 6379

database:
  main:
    writer:
      datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
    reader:
      datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
      properties:
        hibernate.jdbc.batch_size: 50
        hibernate.order_inserts: true
        hibernate.order_updates: true
        hibernate.default_batch_fetch_size: 100
        hibernate.jdbc.time_zone: Asia/Seoul
        hibernate.cache.use_second_level_cache: false
        hibernate.cache.use_query_cache: false
        hibernate.hbm2ddl.auto: validate
      show-sql: false
      open-in-view: false

yologram:
  ses:
    from-address: no-reply@yologram.link
  auth:
    jwt:
      secret:   # /yologram/service/yologram-api-v1_{ENV}/yologram.auth.jwt.secret
      expire: 86400
      issuer: yologram.link
      audience: yologram.client
    admin-jwt:
      secret:   # /yologram/service/yologram-api-v1_{ENV}/yologram.auth.admin-jwt.secret
      expire: 86400
      issuer: yologram.link
      audience: yologram.admin

springdoc:
  swagger-ui:
    path: /api/v1/docs
    tags-sorter: alpha
  api-docs:
    path: /api/v1/api-docs

management:
  # 캐시는 부가 기능 — Redis 장애가 서비스 health DOWN으로 전파되지 않도록 Redis health indicator 비활성
  # (Redis 자동구성 exclude와 별개로 actuator RedisHealthContributorAutoConfiguration이 수동 빈으로 활성화됨)
  health:
    redis:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint:   # /yologram/service/yologram-api-v1_{ENV}/management.otlp.tracing.endpoint
      headers:
        Authorization:  # /yologram/service/yologram-api-v1_{ENV}/management.otlp.tracing.headers.Authorization
    metrics:
      export:
        url:    # /yologram/service/yologram-api-v1_{ENV}/management.otlp.metrics.export.url
        step: 1m
        headers:
          Authorization:  # /yologram/service/yologram-api-v1_{ENV}/management.otlp.metrics.export.headers.Authorization
    logging:
      endpoint:   # /yologram/service/yologram-api-v1_{ENV}/management.otlp.logging.endpoint
      headers:
        Authorization:  # /yologram/service/yologram-api-v1_{ENV}/management.otlp.logging.headers.Authorization
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment.name: ${spring.profiles.active:default}
      service.instance.id: ${server.hostname:unknown}
      service.namespace: yologram
  metrics:
    tags:
      service.name: ${spring.application.name}
      deployment.environment.name: ${spring.profiles.active:default}
      service.instance.id: ${server.hostname:unknown}
      service.namespace: yologram
