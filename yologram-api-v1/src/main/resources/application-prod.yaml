spring:
  config:
    import:
      - 'aws-parameterstore:/yologram/service/yologram-api-v1_prod/'

cache:
  data:
    redis:
      host:  # Parameter Store 주입 (/yologram/service/yologram-api-v1_prod/cache.data.redis.host)
      port: 6379

# 조회 이벤트 발행 (aws/global/kinesis — PROVISIONED 1샤드, ap-northeast-2)
yologram:
  events:
    publish:
      post-view:
        enabled: true
        stream: yologram-post-view-event-prod

database:
  main:
    writer:
      datasource:
        url:
        username:
        password:
    reader:
      datasource:
        url:
        username:
        password:
    jpa:
      properties:
        hibernate.hbm2ddl.auto: validate
      show-sql: false