spring:
  config:
    import:
      - 'aws-parameterstore:/yologram/service/yologram-api-v1_prod/'

cache:
  data:
    redis:
      host:  # Parameter Store 주입 (/yologram/service/yologram-api-v1_prod/cache.data.redis.host)
      port: 6379

# 조회 이벤트 발행 (aws/global/kinesis — PROVISIONED 1샤드, ap-northeast-2)
yologram:
  events:
    publish:
      post-view:
        enabled: true
        stream: yologram-post-view-event-prod
  # 검색 인덱싱 작업 큐 (aws/global/sqs — DLQ 3회, 가시성 300초)
  messages:
    publish:
      post-index:
        enabled: true
        queue: yologram-search-indexing-prod

database:
  main:
    writer:
      datasource:
        url:
        username:
        password:
    reader:
      datasource:
        url:
        username:
        password:
    jpa:
      properties:
        hibernate.hbm2ddl.auto: validate
      show-sql: false

opensearch:
  main:
    enabled: true   # 스위치는 yaml (환경별 고정값 — SSM에 두면 값 하나 바꾸려고 파라미터를 고쳐야 한다)
    # Parameter Store 주입 (/yologram/service/yologram-api-v1_prod/opensearch.main.*)
    uri:
    username:
    password:
