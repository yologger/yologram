server:
  port: 5001

spring:
  config:
    import:
      - 'aws-parameterstore:/yologram/service/yologram-api-v1_prod/'

cache:
  data:
    redis:
      host: localhost
      port: 16379

# 로컬은 빈 값 유지 = 조회 이벤트 발행 스킵 (local은 prod 파라미터 경로를 import하므로 명시적으로 비워 prod 스트림 오염 방지)
event:
  stream:
    post-view:
      name:

database:
  main:
    writer:
      datasource:
        url:
        username:
        password:
    reader:
      datasource:
        url:
        username:
        password:
    jpa:
      properties:
        hibernate.hbm2ddl.auto: validate
      show-sql: true
