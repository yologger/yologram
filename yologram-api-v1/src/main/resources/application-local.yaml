server:
  port: 5001

spring:
  config:
    import:
      - 'aws-parameterstore:/yologram/service/yologram-api-v1_local/'
      - 'optional:aws-parameterstore:/yologram/service/yologram-api-v1_prod/'
  cloud.aws.credentials.profile.name: yologram

database:
  main:
    writer:
      datasource:
        url:
        username:
        password:
    reader:
      datasource:
        url:
        username:
        password:
    jpa:
      properties:
        hibernate.hbm2ddl.auto: update
      show-sql: true
