# 테스트는 Redis 미기동 전제 — Lettuce는 lazy connection이라 부팅에 Redis가 필요 없고,
# 캐시 연산은 RedisCacheService의 runCatching이 미스로 처리해 DB 폴백된다 (통합 테스트는 자체 컨테이너 사용)
cache:
  data:
    redis:
      host: localhost
      port: 6379

database:
  main:
    writer:
      datasource:
        url: jdbc:tc:mysql:8.0:///yologram?useUnicode=true&charset=utf8mb4&characterEncoding=utf8&serverTimezone=Asia/Seoul
        driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    reader:
      datasource:
        url: jdbc:tc:mysql:8.0:///yologram?useUnicode=true&charset=utf8mb4&characterEncoding=utf8&serverTimezone=Asia/Seoul
        driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    jpa:
      properties:
        hibernate.hbm2ddl.auto: create-drop
      show-sql: true

management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
    logging:
      endpoint: http://localhost:4318/v1/logs
  tracing:
    enabled: false
