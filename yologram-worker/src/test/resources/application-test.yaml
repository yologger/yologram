# 테스트: OTLP는 더미 엔드포인트로 exporter 생성만 통과시키고 전송은 비활성 (api-v1 패턴)
management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        enabled: false
    logging:
      endpoint: http://localhost:4318/v1/logs
  tracing:
    enabled: false
