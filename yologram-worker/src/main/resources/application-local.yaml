server:
  port: 5003

spring:
  config:
    import:
      # 로컬 설정은 worker_local만 — prod 파라미터 유입 방지 (DB·LLM 키는 worker_local에 등록)
      - 'optional:aws-parameterstore:/yologram/service/yologram-worker_local/'

# 로컬: Valkey(docker) 직결 — SSM 미사용 (api-v1 로컬과 동일 패턴)
cache:
  data:
    redis:
      host: localhost
      port: 16379

# Parameter Store 주입 (/yologram/service/yologram-worker_local/database.main.*)
database:
  main:
    writer:
      datasource:
        url:
        username:
        password:
    reader:
      datasource:
        url:
        username:
        password:
    jpa:
      properties:
        hibernate.hbm2ddl.auto: update
      show-sql: true

# 로컬: OTLP는 더미 엔드포인트로 exporter 생성만 통과시키고 전송 비활성 (Parameter Store 없이 기동)
management:
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
    metrics:
      export:
        url: http://localhost:4318/v1/metrics
        enabled: false
    logging:
      endpoint: http://localhost:4318/v1/logs
  tracing:
    enabled: false
