spring:
  config:
    import:
      - 'aws-parameterstore:/yologram/service/yologram-worker_prod/'

  cloud:
    function:
      definition: postViewEventSubscribe
    stream:
      bindings:
        postViewEventSubscribe-in-0:
          destination: yologram-post-view-event-prod
          group: yologram-worker
          consumer:
            batch-mode: true
            use-native-decoding: true
      kinesis:
        binder:
          kpl-kcl-enabled: true
          auto-create-stream: false
        bindings:
          postViewEventSubscribe-in-0:
            consumer:
              listener-mode: batch
              checkpoint-mode: manual
              fan-out: false
              metrics-level: NONE
              lease-table-name: yologram-post-view-event-lease-prod
              shard-iterator-type: LATEST # 체크포인트가 없을때 스트림의 최신부터 읽는다

cache:
  data:
    redis:
      host:  # Parameter Store 주입 (/yologram/service/yologram-worker_prod/cache.data.redis.host)
      port: 6379

# Parameter Store 주입 (/yologram/service/yologram-worker_prod/database.main.*)
database:
  main:
    writer:
      datasource:
        url:
        username:
        password:
    reader:
      datasource:
        url:
        username:
        password:

opensearch:
  main:
    enabled: true   # 스위치는 yaml (환경별 고정값 — SSM에 두면 값 하나 바꾸려고 파라미터를 고쳐야 한다)
    uri:
    username:
    password:

yologram:
  events:
    subscribe:
      post-view:
        enabled: true   # prod만 구독 활성 (로컬·테스트는 기본 false — 체크포인트 오염 방지)
  messages:
    subscribe:
      post-index:
        enabled: true
        queue: yologram-search-indexing-prod
  webhooks:
    discord:
      tech-news:  # yologram-news-tech 채널
        url:  # Parameter Store 주입 (/yologram/service/yologram-worker_prod/yologram.webhooks.discord.tech-news.url)
        enabled: true
      invest-news:  # yologram-news-invest 채널
        url:  # Parameter Store 주입 (/yologram/service/yologram-worker_prod/yologram.webhooks.discord.invest-news.url)
        enabled: true
      politics-news:  # yologram-news-politics 채널
        url:  # Parameter Store 주입 (/yologram/service/yologram-worker_prod/yologram.webhooks.discord.politics-news.url)
        enabled: true
  llm:
    gemini:
      api-key:
    groq:
      api-key:

# Parameter Store 주입 (/yologram/service/yologram-worker_prod/management.otlp.*)
management:
  otlp:
    tracing:
      endpoint:
      headers:
        Authorization:
    metrics:
      export:
        url:
        headers:
          Authorization:
    logging:
      endpoint:
      headers:
        Authorization:
