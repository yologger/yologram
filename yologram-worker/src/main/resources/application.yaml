server:
  port: 5000

spring:
  application:
    name: yologram-worker
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

cache:
  data:
    redis:
      host:
      port: 6379

database:
  main:
    writer:
      datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          # 워커는 주기 배치 위주 — 커넥션 최소 유지
          maximum-pool-size: 2
          minimum-idle: 1
          # 커넥션 수명 15분 — 낡은 커넥션 주기 교체 (번장 bun-ums-api 미러, Hikari 기본 30분 단축).
          # 죽은 커넥션 소켓 타임아웃은 JDBC URL의 socketTimeout/connectTimeout이 담당 (SSM url 파라미터)
          max-lifetime: 900000
    reader:
      datasource:
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
          maximum-pool-size: 2
          minimum-idle: 1
          max-lifetime: 900000
    jpa:
      properties:
        hibernate.jdbc.batch_size: 50
        hibernate.order_inserts: true
        hibernate.order_updates: true
        hibernate.default_batch_fetch_size: 100
        hibernate.jdbc.time_zone: Asia/Seoul
        hibernate.cache.use_second_level_cache: false
        hibernate.cache.use_query_cache: false
        hibernate.hbm2ddl.auto: validate
      show-sql: false
      open-in-view: false

yologram:
  batches:
    # 주기 배치 스케줄 — 배치가 늘면 yologram.batches.{배치명}.schedule로 추가
    tech-news-collect:
      schedule: "0 0/10 * * * *"   # 10분마다 (매시 0,10,20,30,40,50분)
    tech-news-summarize:
      schedule: "0 0/5 * * * *"    # 5분마다
    post-view-purge:
      schedule: "0 30 4 * * *"     # 하루 1회 04:30 — 조회 이력 30일 보관 정리 (트래픽 최저 시간대)
  events:
    subscribe:
      post-view:
        enabled: false
  webhooks:
    discord:
      tech-news:
        url:  # /yologram/service/yologram-worker_{ENV}/yologram.webhooks.discord.tech-news.url
        enabled: false
  llm:
    gemini:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      completions-path: /chat/completions
      # flash-lite 계열 — 상위 모델(3.5-flash)은 무료 티어 20 req/일뿐이라 부적합. 쿼터는 모델별
      model: gemini-3.1-flash-lite
      api-key:  # /yologram/service/yologram-worker_{ENV}/yologram.llm.gemini.api-key
    groq:
      base-url: https://api.groq.com/openai
      completions-path: /v1/chat/completions
      # /v1/models 실조회 기준 (llama-4-scout는 Groq에서 내려감)
      model: llama-3.3-70b-versatile
      api-key:  # /yologram/service/yologram-worker_{ENV}/yologram.llm.groq.api-key

management:
  # 캐시는 부가 기능 — Redis 장애가 서비스 health DOWN(ECS 태스크 교체·CI health 테스트 실패)으로
  # 전파되지 않도록 Redis health indicator 비활성. Redis 자동구성은 exclude했지만 actuator의
  # RedisHealthContributorAutoConfiguration은 별개라 수동 RedisConnectionFactory 빈만으로 활성화됨
  health:
    redis:
      enabled: false
    # 조회 이벤트 소비도 부가 기능 — Kinesis 일시 장애가 health DOWN(ECS 태스크 교체)으로 번져
    # 뉴스 파이프라인까지 함께 죽는 것을 막는다 (위 Redis와 동일한 판단).
    # 소비 중단은 스트림 24시간 보관 + 재기동 후 체크포인트 이어읽기로 복구되므로 태스크 교체가 해법이 아니다
    binders:
      enabled: false
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint:   # /yologram/service/yologram-worker_{ENV}/management.otlp.tracing.endpoint
      headers:
        Authorization:  # /yologram/service/yologram-worker_{ENV}/management.otlp.tracing.headers.Authorization
    metrics:
      export:
        url:    # /yologram/service/yologram-worker_{ENV}/management.otlp.metrics.export.url
        step: 1m
        headers:
          Authorization:  # /yologram/service/yologram-worker_{ENV}/management.otlp.metrics.export.headers.Authorization
    logging:
      endpoint:   # /yologram/service/yologram-worker_{ENV}/management.otlp.logging.endpoint
      headers:
        Authorization:  # /yologram/service/yologram-worker_{ENV}/management.otlp.logging.headers.Authorization
  opentelemetry:
    resource-attributes:
      service.name: ${spring.application.name}
      deployment.environment.name: ${spring.profiles.active:default}
      service.instance.id: ${server.hostname:unknown}
      service.namespace: yologram
  metrics:
    tags:
      service.name: ${spring.application.name}
      deployment.environment.name: ${spring.profiles.active:default}
      service.instance.id: ${server.hostname:unknown}
      service.namespace: yologram
