name: yologram-web-v1

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'yologram-web-v1/**'
  pull_request:
    branches: [master]
    paths:
      - 'yologram-web-v1/**'

env:
  S3_BUCKET: yologram-web-v1

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yologram-web-v1/yarn.lock

      - name: Install dependencies
        working-directory: yologram-web-v1
        run: yarn install --immutable

      - name: Run tests
        working-directory: yologram-web-v1
        run: yarn test

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yologram-web-v1/yarn.lock

      - name: Install dependencies
        working-directory: yologram-web-v1
        run: yarn install --immutable

      - name: Build
        working-directory: yologram-web-v1
        run: yarn build:prod

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3
        working-directory: yologram-web-v1
        run: |
          aws s3 sync build/ s3://${{ env.S3_BUCKET }} --delete --cache-control "max-age=31536000,public"
          aws s3 cp build/index.html s3://${{ env.S3_BUCKET }}/index.html --cache-control "no-cache,no-store,must-revalidate"

      - name: Discord 알림
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          JOB_STATUS: ${{ job.status }}
          REF_NAME: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            COLOR=3066993
            EMOJI="✅"
            STATUS="success"
          else
            COLOR=15158332
            EMOJI="❌"
            STATUS="failed"
          fi
          COMMIT_TITLE=$(printf '%s' "$COMMIT_MSG" | head -1)
          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-8)
          PAYLOAD=$(jq -cn \
            --arg title "$EMOJI $WORKFLOW" \
            --argjson color "$COLOR" \
            --arg status "$STATUS" \
            --arg run "$RUN_URL" \
            --arg branch "$REF_NAME" \
            --arg sha "$SHORT_SHA" \
            --arg msg "$COMMIT_TITLE" \
            '{embeds:[{title:$title, color:$color, description:("- result: `\($status)` ([see details](\($run)))\n- branch: `\($branch)`\n- commit: `\($sha)`\n```\n\($msg)\n```")}]}')
          curl -s -H "Content-Type: application/json" -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"
