name: yologram-api-v1

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'v1/yologram-api-v1/**'
  pull_request:
    branches: [master]
    paths:
      - 'v1/yologram-api-v1/**'

env:
  ECR_REPOSITORY: yologram-api-v1
  ECS_CLUSTER: ecs-prod
  ECS_SERVICE: yologram-api-v1-prod
  ECS_TASK_FAMILY: yologram-api-v1-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Gradle build
        working-directory: v1/yologram-api-v1
        run: ./gradlew build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push Docker image
        working-directory: v1/yologram-api-v1
        run: |
          BRANCH=${GITHUB_REF##*/}
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-8)
          IMAGE_TAG=${BRANCH}-${SHORT_SHA}
          ECR_URL=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          docker build -t $ECR_URL:$IMAGE_TAG -t $ECR_URL:latest .
          docker push $ECR_URL:$IMAGE_TAG
          docker push $ECR_URL:latest

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}
