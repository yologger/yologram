name: yologram-api-v2

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'yologram-api-v2/**'
  pull_request:
    branches: [master]
    paths:
      - 'yologram-api-v2/**'

env:
  ECR_REPOSITORY: yologram-api-v2
  ECS_CLUSTER: ecs-prod
  ECS_SERVICE: yologram-api-v2-prod
  ECS_TASK_FAMILY: yologram-api-v2-prod

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        working-directory: yologram-api-v2
        run: uv sync

      - name: Run tests
        working-directory: yologram-api-v2
        run: uv run pytest tests/ -v

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr-login

      - name: Build and push Docker image
        working-directory: yologram-api-v2
        run: |
          BRANCH=${GITHUB_REF##*/}
          SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-8)
          IMAGE_TAG=${BRANCH}-${SHORT_SHA}
          ECR_URL=${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          docker build -t $ECR_URL:$IMAGE_TAG -t $ECR_URL:latest .
          docker push $ECR_URL:$IMAGE_TAG
          docker push $ECR_URL:latest

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --region ${{ secrets.AWS_REGION }}

      - name: Discord 알림
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            EMOJI="✅"
            STATUS="success"
          else
            COLOR=15158332
            EMOJI="❌"
            STATUS="failed"
          fi
          COMMIT_MSG=$(echo '${{ github.event.head_commit.message }}' | head -1)
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-8)
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          DESCRIPTION="- result: \`${STATUS}\` ([see details](${RUN_URL}))\n- branch: \`${{ github.ref_name }}\`\n- commit: \`${SHORT_SHA}\`\n\`\`\`\n${COMMIT_MSG}\n\`\`\`"
          curl -s -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"${EMOJI} ${{ github.workflow }}\",\"color\":${COLOR},\"description\":\"${DESCRIPTION}\"}]}" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
